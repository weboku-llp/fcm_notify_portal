[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "apps/api/**",
  "apps/worker/**",
  "apps/web/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "Dockerfile",
  "docker/**"
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
